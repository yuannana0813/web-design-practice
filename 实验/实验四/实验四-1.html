<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .btn{
            width: 125px;
            height: 45px;
            font-size: 26px;
        }
        .btn:hover{
            background-color: gold;
            border: orange 4px solid;
            cursor: pointer;
        }
        .btn:active{
            background-color: #ccc;
            border: purple 4px solid;
        }
        .text{
            border: 2px pink solid;
        }
        .text:focus{
            background-color: pink;
        }
    </style>
</head>
<body>
    <button class="btn">搜索按钮</button><br>
    <input type="text" placeholder="我是一个文本输入框" class="text">
</body>
</html>
