<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 未访问过 */
        a:link{
            color: blue;
            text-decoration: none;
        }
        /* 已访问 */
        a:visited{
            color: yellow;
        }
        /* 鼠标悬停 */
        a:hover{
            background-color: gray;
        }
        /* 鼠标按住 */
        a:active{
            color: red;
        }
    </style>
</head>
<body>
    <a href="#11">111</a>
    <a href="#22">222</a>
    <a href="#33">333</a>
    <a href="#44">444</a>
</body>
</html>
