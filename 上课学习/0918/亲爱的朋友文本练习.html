<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .letter{
            width: 600px;
            border: 2px solid #ccc;
            padding: 20px;
            border-radius: 10px;
        }
         .a1 {
            font-size: 16px;
            color: #8B4513;
            text-align: right;
        }
         .a2 {
            font-size: 18px;
            color: #4682b4;
            text-align: left;
        }
         .a3 {
            font-size: 16px;
            color: #333333;
            text-indent: 2em;
        }
         .a4 {
            font-size: 18px;
            color: #2F4F4F;
            text-align: right;
        }
    </style>
</head>
<body>
    <div class="letter">
        <h2 style="color: #2e8b57; text-align: center;" >亲爱的朋友：</h2>
        <div class="a1">2025年9月24日</div>
        <div class="a2">你好！</div>
        <div class="a3">希望这封信可以找到你，并且你一切安好。最近我一直在忙于我的工作和一些个人项目，
            也在思考我们之前谈论过的话题。我相信我们都在不断成长，面对新的挑战和机遇。
            希望在未来能有更多的交流与合作。
        </div>
        <div class="a4">祝一切顺利，你的朋友</div>

    </div>
</body>
</html>
