<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul li a {
            text-decoration: underline dotted;
        }
        a:visited {
            color: purple;
        }
        a:hover {
            color: palevioletred;
            background-color: gray;
            font-weight: 700;
            text-decoration: none;
        }
         a:active {
            color: red;
            text-decoration: red  underline double ;
        }
    </style>
</head>
<body>
    <ul>
        <li><a href="#article">科技文章</a></li>
        <li><a href="#travel">旅行见闻</a></li>
        <li><a href="#food">美食分享</a></li>
        <li><a href="#life">生活方式</a></li>
    </ul>
</body>
</html>
