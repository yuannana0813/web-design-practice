<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
 .father {
    width: 200px;
    height: 200px;
    background-color: red;
 }
.son {
    width: 30px;
    height: 30px;
    background-color: black;
}
.brother1,.brother2 {
    width: 100px;
    height: 100px;
    border: 2px solid black;
    background-color: pink;
    text-align: center;
}
.father:hover .son {
    background-color:blue;
}
.brother1:hover ~.brother2 {
    background-color: red;
}

    </style>
</head>
<body>
    <div class="father">
        <div class="son"></div> 
    </div>
    <div class="brother1">1</div>
        <div class="brother2">2</div>
        <div class="brother2">2</div>
</body>
</html>
