<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>input 表单元素</title>
</head>
<body>
    
    <form action="aaa.php" method="POST" >
        <!-- text文本框 用户可以里面输入任何文字 -->
        用户名：<input type="text" name="username" value="请输入用户名" maxlength="6"> <br><br>
        <!-- 密码框 -->
         密码：<input type="password" name="pwd"  maxlength="6" ><br><br>
         <!-- 单选按钮 可以实现多选一 -->
         <!-- name是表单元素名字 这里性别单选按钮必须有相同的名字name 才可以实现多选一 -->
         婚姻状态： 未婚<input type="radio" name="demo" value="未婚">已婚<input type="radio" name="demo" value="已婚"><br><br>
        性别：<label for="sex1">男</label>
        <input type="radio" name="sex" value="男" id="sex1">
         <label for="sex2">女</label>
         <input type="radio" name="sex" value="女" id="sex2"><br>
        <!-- 多选按钮 复选框 可以实现多选 -->
        爱好：吃饭<input type="checkbox" value="吃饭">睡觉<input type="checkbox" value="睡觉"  checked="checked">打豆豆<input type="checkbox" value="打豆豆">
        <!--name和value属性是给后台人员使用-->
   <br>

   <!--把表单域里的表单元素提交给服务器-->
 <input type="submit" value="免费注册">
 <!--重置表单元素-->
 <input type="reset" value="重新填写">

 <!--普通按钮 button  后期结合js 搭配使用-->
 <input type="button" value="获取短信验证码"> <br>
 <!--文件域 使用场景 上传文件使用的-->
 上传头像： <input type="file">
    </form>
</body>
</html>
